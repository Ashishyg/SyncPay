# SyncPay for an existing nginx (use with: sudo SKIP_CADDY=1 bash setup.sh)
#   sudo cp /opt/syncpay/deploy/nginx.conf /etc/nginx/sites-available/syncpay
#   sudo ln -s /etc/nginx/sites-available/syncpay /etc/nginx/sites-enabled/syncpay
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d syncpay.acrossthe.cloud      # adds HTTPS
server {
    listen 80;
    server_name syncpay.acrossthe.cloud;
    root /var/www/syncpay;

    # API -> Node backend (only /api is exposed; /whatsapp stays local-only)
    location /api/ {
        proxy_pass http://127.0.0.1:3100;   # SyncPay's PORT in /opt/syncpay/backend/.env
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service worker / HTML must never be cached, or app updates never reach phones
    location ~ ^/(sw\.js|registerSW\.js|index\.html|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Installable web app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }
}
